# Paths
root = "."
tmp_dir = "tmp"

# Build
[build]
  cmd = "go build -o ./tmp/api ./cmd/http"
  entrypoint = ["./tmp/api"]
  delay = 500
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

# Watch
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", "docs", ".git"]
  exclude_regex = ["_test\\.go$"]

# Output
[log]
  time = true

[misc]
  clean_on_exit = true
