services:
  # Step 1: MongoDB with a healthcheck so the API only starts once it accepts connections
  mongo:
    image: mongo:8.2
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Step 2: the API, built from the Dockerfile and started after Mongo is healthy, every setting comes from .env with the same defaults as the code
  api:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-user_api}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-user-api}
      JWT_TTL: ${JWT_TTL:-1h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      USER_COUNT_INTERVAL: ${USER_COUNT_INTERVAL:-10s}
    ports:
      - "8080:8080"
    # Step 3: give graceful shutdown more time than SHUTDOWN_TIMEOUT before docker sends SIGKILL
    stop_grace_period: 20s

# Step 4: named volume so data survives docker compose down
volumes:
  mongo-data:
